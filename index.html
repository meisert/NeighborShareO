        <h1>NeighborShare — Neighborhood Item Sharing in Austin, TX</h1>
        <p><strong>"Why buy when you can borrow from a neighbor?"</strong> NeighborShare is a free, zero-commission community network allowing trusted neighbors to borrow and lend household tools, lawn care equipment, camping gear, and event supplies right on their block.</p>
        
        <h2>Available Categories in Your Neighborhood</h2>
        <ul>
          <li><strong>Tools & Workshop:</strong> Cordless drills, compound miter saws, 17ft aluminum articulated ladders, socket sets, and sanders.</li>
          <li><strong>Outdoor & Lawn Care:</strong> Electric pressure washers, lawn aerators, broadcast spreaders, and cordless leaf blowers.</li>
          <li><strong>Camping & Recreation:</strong> 6-person cabin tents, dual-burner outdoor camp stoves, griddles, and sleeping pads.</li>
          <li><strong>Party & Events:</strong> 10x10 heavy-duty pop-up shade canopies, folding banquet tables, and outdoor chair sets.</li>
          <li><strong>Kitchen Appliances:</strong> Rotary Belgian waffle stations, 14-cup food processors, and stand mixers.</li>
        </ul>

        <h2>Participating Austin Communities</h2>
        <p>Serving South Austin neighborhoods including Shady Hollow, Tanglewood Forest, Castlewood Forest, South Manchaca, Bauerle Ranch, Circle C Ranch, South Congress, Onion Creek, Sendera, Maple Run, and Olympic Heights (Zip Codes: 78748, 78745, 78749, 78739, 78704, 78747).</p>

        <h2>How NeighborShare Works</h2>
        <ol>
          <li><strong>Explore Local Garage Listings:</strong> Search items listed by verified neighbors within 1 to 25 miles of your home.</li>
          <li><strong>Request to Borrow:</strong> Select dates, propose a pickup window, and send a message.</li>
          <li><strong>Porch Pickup & Return:</strong> Coordinate porch handoffs directly with neighbors with zero platform fees or transaction markups.</li>
        </ol>
